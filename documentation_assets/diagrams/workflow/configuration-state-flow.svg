<svg viewBox="0 0 940 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5f8f"/>
    </marker>
  </defs>

  <style>
    .box { fill:#eaf1fb; stroke:#2f5f8f; stroke-width:1.6; rx:8; ry:8; }
    .lbl { fill:#1c1c1c; font-size:14px; text-anchor:middle; dominant-baseline:middle; }
    .arr { stroke:#2f5f8f; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>

  <!-- Row 1 -->
  <rect class="box" x="20"  y="20" width="190" height="60"/>
  <text class="lbl" x="115" y="50">Trạng thái hiện tại</text>

  <rect class="box" x="240" y="20" width="190" height="60"/>
  <text class="lbl" x="335" y="50">Chỉnh sửa</text>

  <rect class="box" x="460" y="20" width="190" height="60"/>
  <text class="lbl" x="555" y="50">Trạng thái mong muốn</text>

  <rect class="box" x="680" y="20" width="190" height="60"/>
  <text class="lbl" x="775" y="50">Cấu hình chờ</text>

  <!-- Row 1 arrows -->
  <path class="arr" d="M210,50 L236,50"/>
  <path class="arr" d="M430,50 L456,50"/>
  <path class="arr" d="M650,50 L676,50"/>

  <!-- Connector: end of row 1 -> start of row 2 -->
  <path class="arr" d="M775,80 L775,150 L115,150 L115,176"/>

  <!-- Row 2 -->
  <rect class="box" x="20"  y="180" width="190" height="60"/>
  <text class="lbl" x="115" y="210">Xem trước</text>

  <rect class="box" x="240" y="180" width="190" height="60"/>
  <text class="lbl" x="335" y="210">Đẩy cấu hình</text>

  <rect class="box" x="460" y="180" width="190" height="60"/>
  <text class="lbl" x="555" y="210">Xác minh</text>

  <!-- Row 2 arrows -->
  <path class="arr" d="M210,210 L236,210"/>
  <path class="arr" d="M430,210 L456,210"/>
</svg>
