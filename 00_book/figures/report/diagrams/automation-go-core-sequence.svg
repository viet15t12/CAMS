<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
      .box { fill: #f8fafc; stroke: #111827; stroke-width: 2; rx: 10; }
      .life { stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 8 7; }
      .msg { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .title { font: 700 22px "Liberation Sans", Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .sub { font: 17px "Liberation Sans", Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .label { font: 21px "Liberation Sans", Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .note { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; rx: 9; }
      .noteText { font: 19px "Liberation Sans", Arial, sans-serif; fill: #1e3a8a; text-anchor: middle; }
      .phase { font: 700 18px "Liberation Sans", Arial, sans-serif; fill: #2563eb; text-anchor: start; }
      .footer { font: 21px "Liberation Sans", Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
    </style>
  </defs>

  <rect class="frame" x="1" y="1" width="1598" height="1118"/>

  <rect class="box" x="25" y="26" width="180" height="88"/>
  <text class="title" x="115" y="78">Thiết bị mạng</text>

  <rect class="box" x="245" y="26" width="180" height="88"/>
  <text class="title" x="335" y="78">Bộ thu C++</text>

  <rect class="box" x="465" y="26" width="180" height="88"/>
  <text class="title" x="555" y="65">SQLite</text>
  <text class="sub" x="555" y="91">dữ liệu giám sát</text>

  <rect class="box" x="685" y="26" width="180" height="88"/>
  <text class="title" x="775" y="65">Python</text>
  <text class="sub" x="775" y="91">điều phối</text>

  <rect class="box" x="905" y="26" width="180" height="88"/>
  <text class="title" x="995" y="56">Automation</text>
  <text class="title" x="995" y="80">Engine</text>
  <text class="sub" x="995" y="103">(Go core)</text>

  <rect class="box" x="1125" y="26" width="180" height="88"/>
  <text class="title" x="1215" y="65">Executor SSH</text>
  <text class="sub" x="1215" y="91">áp dụng, xác minh</text>

  <rect class="box" x="1345" y="26" width="180" height="88"/>
  <text class="title" x="1435" y="78">QML</text>

  <line class="life" x1="115" y1="114" x2="115" y2="1018"/>
  <line class="life" x1="335" y1="114" x2="335" y2="1018"/>
  <line class="life" x1="555" y1="114" x2="555" y2="1018"/>
  <line class="life" x1="775" y1="114" x2="775" y2="1018"/>
  <line class="life" x1="995" y1="114" x2="995" y2="1018"/>
  <line class="life" x1="1215" y1="114" x2="1215" y2="1018"/>
  <line class="life" x1="1435" y1="114" x2="1435" y2="1018"/>

  <text class="phase" x="38" y="151">Tiếp nhận và chuẩn hóa</text>

  <rect x="141" y="154" width="168" height="32" fill="#ffffff"/>
  <text class="label" x="225" y="177">1. Syslog UDP/TCP</text>
  <line class="msg" x1="115" y1="190" x2="335" y2="190"/>

  <rect x="345" y="214" width="200" height="32" fill="#ffffff"/>
  <text class="label" x="445" y="237">2. Lưu bản tin gốc</text>
  <line class="msg" x1="335" y1="250" x2="555" y2="250"/>

  <rect x="432" y="274" width="246" height="32" fill="#ffffff"/>
  <text class="label" x="555" y="297">3. Phát security event</text>
  <line class="msg" x1="335" y1="310" x2="775" y2="310"/>

  <rect x="562" y="334" width="206" height="32" fill="#ffffff"/>
  <text class="label" x="665" y="357">4. Lưu event, evidence</text>
  <line class="msg" x1="775" y1="370" x2="555" y2="370"/>

  <text class="phase" x="38" y="421">Đánh giá theo chu kỳ</text>

  <rect x="568" y="424" width="194" height="32" fill="#ffffff"/>
  <text class="label" x="665" y="447">5. Lấy event chờ</text>
  <line class="msg" x1="775" y1="460" x2="555" y2="460"/>

  <rect x="784" y="484" width="202" height="32" fill="#ffffff"/>
  <text class="label" x="885" y="507">6. Gửi event và rule</text>
  <line class="msg" x1="775" y1="520" x2="995" y2="520"/>

  <rect class="note" x="882" y="548" width="226" height="100"/>
  <text class="noteText" x="995" y="578">Khớp điều kiện và phạm vi</text>
  <text class="noteText" x="995" y="606">Trích biến, kiểm tra kiểu</text>
  <text class="noteText" x="995" y="634">Chống lặp, giới hạn tần suất</text>

  <rect x="780" y="664" width="210" height="32" fill="#ffffff"/>
  <text class="label" x="885" y="687">7. Trả kế hoạch xử lý</text>
  <line class="return" x1="995" y1="700" x2="775" y2="700"/>

  <rect x="560" y="724" width="210" height="32" fill="#ffffff"/>
  <text class="label" x="665" y="747">8. Lưu hành động</text>
  <line class="msg" x1="775" y1="760" x2="555" y2="760"/>

  <text class="phase" x="38" y="811">Phản ứng và xác minh</text>

  <rect x="884" y="814" width="222" height="32" fill="#ffffff"/>
  <text class="label" x="995" y="837">9. Chuyển lệnh auto</text>
  <line class="msg" x1="775" y1="850" x2="1215" y2="850"/>

  <rect x="500" y="874" width="330" height="32" fill="#ffffff"/>
  <text class="label" x="665" y="897">10. SSH cấu hình và xác minh</text>
  <line class="msg" x1="1215" y1="910" x2="115" y2="910"/>

  <rect x="770" y="934" width="230" height="32" fill="#ffffff"/>
  <text class="label" x="885" y="957">11. Lưu kết quả xử lý</text>
  <line class="msg" x1="1215" y1="970" x2="555" y2="970"/>

  <rect x="996" y="984" width="218" height="32" fill="#ffffff"/>
  <text class="label" x="1105" y="1007">12. Cập nhật giao diện</text>
  <line class="msg" x1="775" y1="1020" x2="1435" y2="1020"/>

  <text class="footer" x="800" y="1082">Syslog → lưu sự kiện → Automation Engine (Go core) đánh giá → executor áp dụng và xác minh</text>
</svg>
