<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
    <style>
      text { font-family: 'Liberation Sans', Arial, sans-serif; fill: #000000; }
      .head { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .life { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 7 5; }
      .msg { stroke: #000000; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .reply { stroke: #000000; stroke-width: 1.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .note { fill: #ffffff; stroke: #000000; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="box" x="20" y="20" width="160" height="58" rx="7"/><text class="head" x="100" y="55" text-anchor="middle">Người quản trị</text>
  <rect class="box" x="220" y="20" width="160" height="58" rx="7"/><text class="head" x="300" y="55" text-anchor="middle">QML</text>
  <rect class="box" x="420" y="20" width="160" height="58" rx="7"/><text class="head" x="500" y="44" text-anchor="middle">Bộ điều khiển</text><text class="label" x="500" y="65" text-anchor="middle">Jinja2</text>
  <rect class="box" x="620" y="20" width="160" height="58" rx="7"/><text class="head" x="700" y="55" text-anchor="middle">SQLite</text>
  <rect class="box" x="820" y="20" width="160" height="58" rx="7"/><text class="head" x="900" y="44" text-anchor="middle">Worker</text><text class="label" x="900" y="65" text-anchor="middle">Session / Lock</text>
  <rect class="box" x="1020" y="20" width="160" height="58" rx="7"/><text class="head" x="1100" y="55" text-anchor="middle">Thiết bị</text>

  <path class="life" d="M100 78V690M300 78V690M500 78V690M700 78V690M900 78V690M1100 78V690"/>

  <path class="msg" d="M100 118H300"/><text class="label" x="200" y="108" text-anchor="middle">1. Chọn thiết bị và chức năng</text>
  <path class="msg" d="M300 165H500"/><text class="label" x="400" y="155" text-anchor="middle">2. Yêu cầu dữ liệu chờ</text>
  <path class="msg" d="M500 212H700"/><text class="label" x="600" y="202" text-anchor="middle">3. Đọc bản ghi</text>
  <path class="reply" d="M700 259H500"/><text class="label" x="600" y="249" text-anchor="middle">4. Trả dữ liệu chờ</text>
  <path class="reply" d="M500 306H300"/><text class="label" x="400" y="296" text-anchor="middle">5. Sinh bản xem trước</text>
  <path class="msg" d="M100 353H300"/><text class="label" x="200" y="343" text-anchor="middle">6. Xác nhận Push</text>
  <path class="msg" d="M300 400H900"/><text class="label" x="600" y="390" text-anchor="middle">7. Tạo tác vụ nền kèm thiết bị đích</text>
  <path class="msg" d="M900 447H1100"/><text class="label" x="1000" y="437" text-anchor="middle">8. Khóa phiên, gửi lệnh</text>
  <path class="reply" d="M1100 494H900"/><text class="label" x="1000" y="484" text-anchor="middle">9. Phản hồi CLI</text>
  <path class="msg" d="M900 541H700"/><text class="label" x="800" y="531" text-anchor="middle">10. Cập nhật trạng thái</text>
  <path class="reply" d="M900 588H300"/><text class="label" x="600" y="578" text-anchor="middle">11. Trả kết quả theo thiết bị</text>
  <path class="reply" d="M300 635H100"/><text class="label" x="200" y="625" text-anchor="middle">12. Hiển thị kết quả</text>

  <rect class="note" x="350" y="690" width="500" height="48" rx="6"/>
  <text class="label" x="600" y="710" text-anchor="middle">Nếu thực thi lỗi hoặc chỉ thành công một phần, CAMS giữ thông tin</text>
  <text class="label" x="600" y="730" text-anchor="middle">để người dùng đối chiếu và đồng bộ lại trạng thái thiết bị.</text>
</svg>
