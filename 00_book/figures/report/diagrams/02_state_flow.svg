      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
      .lbl { fill: #000000; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
