  <rect class="box" x="680" y="20" width="190" height="60" rx="8"/>
  <text class="lbl" x="775" y="50">Cấu hình chờ</text>

  <path class="arr" d="M210,50 H236"/>
  <path class="arr" d="M430,50 H456"/>
  <path class="arr" d="M650,50 H676"/>
  <path class="arr" d="M775,80 V150 H115 V176"/>

  <rect class="box" x="20" y="180" width="190" height="60" rx="8"/>
