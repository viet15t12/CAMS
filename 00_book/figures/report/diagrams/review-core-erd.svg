<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="10" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      text { font-family: 'Liberation Sans', Arial, sans-serif; fill: #000000; }
      .title { font-size: 19px; font-weight: 700; }
      .key { font-size: 14px; }
      .card { font-size: 13px; }
      .note { font-size: 15px; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .bus { fill: none; stroke: #000000; stroke-width: 1.5; }
      .rel { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>

  <!-- Bảng gốc -->
  <rect class="box" x="560" y="20" width="280" height="76" rx="8"/>
  <text class="title" x="700" y="52" text-anchor="middle">t01_devices</text>
  <text class="key" x="700" y="77" text-anchor="middle">PK host</text>

  <!-- Các bảng con tham chiếu trực tiếp t01_devices -->
  <rect class="box" x="20" y="180" width="240" height="76" rx="8"/>
  <text class="title" x="140" y="212" text-anchor="middle">t02_interface_name</text>
  <text class="key" x="140" y="237" text-anchor="middle">PK iface_id · FK host</text>

  <rect class="box" x="300" y="180" width="240" height="76" rx="8"/>
  <text class="title" x="420" y="212" text-anchor="middle">t04_ospf_processes</text>
  <text class="key" x="420" y="237" text-anchor="middle">PK ospf_id · FK host</text>

  <rect class="box" x="580" y="180" width="240" height="76" rx="8"/>
  <text class="title" x="700" y="212" text-anchor="middle">t05_ACL_DB</text>
  <text class="key" x="700" y="237" text-anchor="middle">PK Acl_id · FK host</text>

  <rect class="box" x="860" y="180" width="240" height="76" rx="8"/>
  <text class="title" x="980" y="212" text-anchor="middle">t05_NAT_DB</text>
  <text class="key" x="980" y="237" text-anchor="middle">PK nat_id · FK host</text>

  <rect class="box" x="1140" y="170" width="240" height="96" rx="8"/>
  <text class="title" x="1260" y="199" text-anchor="middle">t10_syslog_servers</text>
  <text class="key" x="1260" y="224" text-anchor="middle">PK device_host, server_ip,</text>
  <text class="key" x="1260" y="244" text-anchor="middle">protocol, port · FK device_host</text>

  <!-- Trục phân nhánh: các đường dừng trước viền khối 4 px -->
  <path class="bus" d="M700 96V126H140M140 126H1260"/>
  <path class="rel" d="M140 126V176"/>
  <path class="rel" d="M420 126V176"/>
  <path class="rel" d="M700 126V176"/>
  <path class="rel" d="M980 126V176"/>
  <path class="rel" d="M1260 126V166"/>
  <text class="card" x="151" y="158">1 → 0..n</text>
  <text class="card" x="431" y="158">1 → 0..n</text>
  <text class="card" x="711" y="158">1 → 0..n</text>
  <text class="card" x="991" y="158">1 → 0..n</text>
  <text class="card" x="1271" y="153">1 → 0..n</text>

  <!-- Các bảng con cấp hai -->
  <rect class="box" x="20" y="350" width="240" height="76" rx="8"/>
  <text class="title" x="140" y="382" text-anchor="middle">t02_router_iface_l3</text>
  <text class="key" x="140" y="407" text-anchor="middle">PK/FK iface_id</text>

  <rect class="box" x="300" y="350" width="240" height="76" rx="8"/>
  <text class="title" x="420" y="382" text-anchor="middle">t04_ospf_networks</text>
  <text class="key" x="420" y="407" text-anchor="middle">PK id · FK ospf_id</text>

  <rect class="box" x="580" y="350" width="240" height="76" rx="8"/>
  <text class="title" x="700" y="382" text-anchor="middle">t05_extended_acl_rules</text>
  <text class="key" x="700" y="407" text-anchor="middle">PK id · FK acl_id</text>

  <rect class="box" x="860" y="350" width="240" height="76" rx="8"/>
  <text class="title" x="980" y="382" text-anchor="middle">t05_nat_interfaces</text>
  <text class="key" x="980" y="407" text-anchor="middle">PK id · FK nat_id</text>

  <path class="rel" d="M140 256V346"/>
  <path class="rel" d="M420 256V346"/>
  <path class="rel" d="M700 256V346"/>
  <path class="rel" d="M980 256V346"/>
  <text class="card" x="151" y="316">1 → 0..1</text>
  <text class="card" x="431" y="316">1 → 0..n</text>
  <text class="card" x="711" y="316">1 → 0..n</text>
  <text class="card" x="991" y="316">1 → 0..n</text>

  <!-- Bảng gắn ACL vào cổng, có hai khóa ngoại -->
  <rect class="box" x="480" y="555" width="440" height="88" rx="8"/>
  <text class="title" x="700" y="588" text-anchor="middle">t05_router_iface_acl</text>
  <text class="key" x="700" y="613" text-anchor="middle">PK id · FK iface_id → t02_interface_name</text>
  <text class="key" x="700" y="633" text-anchor="middle">FK acl_id → t05_ACL_DB</text>

  <!-- Tuyến riêng tránh mọi khối cấp hai -->
  <path class="rel" d="M260 218H275V599H476"/>
  <path class="rel" d="M820 218H940V599H924"/>
  <text class="card" x="286" y="586">1 → 0..n</text>
  <text class="card" x="838" y="586">1 → 0..n</text>

  <text class="note" x="700" y="701" text-anchor="middle">Mũi tên biểu diễn khóa ngoại từ bảng cha đến bảng con; mọi quan hệ đều được đối chiếu từ lược đồ device_network.</text>
  <text class="note" x="700" y="729" text-anchor="middle">Bản tin Syslog nhận được thuộc info_collected.db nên không xuất hiện trong sơ đồ khóa ngoại này.</text>
</svg>
