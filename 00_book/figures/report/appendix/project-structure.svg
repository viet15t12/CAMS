<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120">
<rect width="1000" height="1120" fill="white"/>
<text x="500" y="38" text-anchor="middle" font-family="Liberation Serif" font-size="24" font-weight="bold">Cấu trúc mô-đun CAMS Desktop</text>
<rect x="35" y="65" width="930" height="134" rx="8" fill="#f7f9fc" stroke="#5b7083"/>
<text x="58" y="95" font-family="DejaVu Sans Mono" font-size="21" font-weight="bold">UI/</text>
<text x="58" y="122" font-family="Liberation Serif" font-size="19">Giao diện Qt Quick/QML và tài nguyên</text>
<text x="75" y="153" font-family="DejaVu Sans Mono" font-size="17">qml/  -  root, content, devices, features, sftp</text>
<text x="75" y="182" font-family="DejaVu Sans Mono" font-size="17">resources/  -  biểu tượng và tài nguyên giao diện</text>
<rect x="35" y="215" width="930" height="192" rx="8" fill="#f7f9fc" stroke="#5b7083"/>
<text x="58" y="245" font-family="DejaVu Sans Mono" font-size="21" font-weight="bold">core/</text>
<text x="58" y="272" font-family="Liberation Serif" font-size="19">Điều phối PyQt6 và cầu nối chức năng</text>
<text x="75" y="303" font-family="DejaVu Sans Mono" font-size="17">view_push.py, view_push_batch.py, sessions.py</text>
<text x="75" y="332" font-family="DejaVu Sans Mono" font-size="17">interface_slots.py, dhcp_slots.py, acl_slots.py</text>
<text x="75" y="361" font-family="DejaVu Sans Mono" font-size="17">nat_slots.py, fhrp_slots.py, switch_slots.py</text>
<text x="75" y="390" font-family="DejaVu Sans Mono" font-size="17">terminal.py, monitoring.py, settings.py</text>
<rect x="35" y="423" width="930" height="163" rx="8" fill="#f7f9fc" stroke="#5b7083"/>
<text x="58" y="453" font-family="DejaVu Sans Mono" font-size="21" font-weight="bold">features/</text>
<text x="58" y="480" font-family="Liberation Serif" font-size="19">Nghiệp vụ theo chức năng</text>
<text x="75" y="511" font-family="DejaVu Sans Mono" font-size="17">devices, interfaces, dhcp, routing, acl, nat</text>
<text x="75" y="540" font-family="DejaVu Sans Mono" font-size="17">switching, fhrp, syslog, sftp, terminal</text>
<text x="75" y="569" font-family="DejaVu Sans Mono" font-size="17">config_sync, config_backup</text>
<rect x="35" y="602" width="930" height="192" rx="8" fill="#f7f9fc" stroke="#5b7083"/>
<text x="58" y="632" font-family="DejaVu Sans Mono" font-size="21" font-weight="bold">infrastructure/</text>
<text x="58" y="659" font-family="Liberation Serif" font-size="19">Kết nối, lưu trữ, bảo vệ và đóng gói</text>
<text x="75" y="690" font-family="DejaVu Sans Mono" font-size="17">database/  -  schemas, adapter, browser</text>
<text x="75" y="719" font-family="DejaVu Sans Mono" font-size="17">network/  -  session_registry.py và kết nối thiết bị</text>
<text x="75" y="748" font-family="DejaVu Sans Mono" font-size="17">security/  -  credential_cipher.py</text>
<text x="75" y="777" font-family="DejaVu Sans Mono" font-size="17">workspace/  -  package, crypto, snapshot, service</text>
<rect x="35" y="810" width="930" height="134" rx="8" fill="#f7f9fc" stroke="#5b7083"/>
<text x="58" y="840" font-family="DejaVu Sans Mono" font-size="21" font-weight="bold">main.py; scripts/</text>
<text x="58" y="867" font-family="Liberation Serif" font-size="19">Khởi tạo ứng dụng và công cụ dự án</text>
<text x="75" y="898" font-family="DejaVu Sans Mono" font-size="17">main.py  -  điểm khởi tạo ứng dụng</text>
<text x="75" y="927" font-family="DejaVu Sans Mono" font-size="17">scripts/build_databases.py, validate_structure.py</text>
<text x="500" y="976" text-anchor="middle" font-family="Liberation Serif" font-size="17">Các mô-đun đại diện được đối chiếu với kho mã nguồn khi biên tập.</text>
</svg>