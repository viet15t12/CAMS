  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#eceef0" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .sw8 line { stroke:#555; stroke-width:3; fill:none; }
      .link { stroke:#0b67af; stroke-width:2.5; fill:none; stroke-linejoin:round; }
      .pl rect { fill:#dcebf6; stroke:#1d5f99; stroke-width:2.2; }
      .pl text { font-size:15px; font-weight:bold; fill:#1f3a52; text-anchor:middle; dominant-baseline:central; }
      .name { font-size:17px; fill:#222; }
      .swname { font-size:15px; fill:#222; text-anchor:middle; }
      .arrow { stroke:#555; stroke-width:3.5; fill:none; }
      .dev { fill:#fff; stroke:#aaa; stroke-width:2; }
      .cloud { fill:#fff; stroke:#1d5f99; stroke-width:2.5; }
      .pc { fill:#7a7a7a; stroke:#444; stroke-width:2; }
    </style>
    <g id="router">
      <circle r="42" class="dev"/>
      <line x1="-20" y1="-20" x2="-5" y2="-5" class="arrow" marker-end="url(#ah)"/>
      <line x1="5" y1="-5" x2="20" y2="-20" class="arrow" marker-end="url(#ah)"/>
      <line x1="-5" y1="5" x2="-20" y2="20" class="arrow" marker-end="url(#ah)"/>
      <line x1="20" y1="20" x2="5" y2="5" class="arrow" marker-end="url(#ah)"/>
    </g>
    <g id="switch">
