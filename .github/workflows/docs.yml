name: Publish MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "00_book/**"
      - "00_report/**"
      - "mkdocs.yml"
      - "documentation_assets/**"
      - "scripts/documentation_assets.py"
      - "scripts/validate_documentation_assets.py"
      - "scripts/sync_documentation_assets.py"
      - "scripts/provision_typst.py"
      - "scripts/build_typst.py"
      - "scripts/typst-toolchain.lock.json"
      - "requirements-docs.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  typst:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provision pinned Typst and fonts
        run: python scripts/provision_typst.py --destination "$RUNNER_TEMP/typst-toolchain"

      - name: Test toolchain integrity contracts
        run: python -m unittest tests.test_typst_tooling -v

      - name: Compile report and book baselines
        run: python scripts/build_typst.py --toolchain-dir "$RUNNER_TEMP/typst-toolchain" --output-dir "$RUNNER_TEMP/typst-validation"

      - name: Upload temporary validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typst-validation
          path: ${{ runner.temp }}/typst-validation/
          retention-days: 7
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Validate current sources and frozen contracts before sync
        run: python scripts/validate_documentation_assets.py --manifest-only

      - name: Sync generated documentation assets
        run: python scripts/sync_documentation_assets.py

      - name: Validate references and staging after sync
        run: python scripts/validate_documentation_assets.py --check-staging

      - name: Build website
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, typst]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
