name: Publish MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "00_book/**"
      - "mkdocs.yml"
      - "documentation_assets/**"
      - "scripts/documentation_assets.py"
      - "scripts/validate_documentation_assets.py"
      - "scripts/sync_documentation_assets.py"
      - "requirements-docs.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Validate documentation asset manifest and references
        run: python scripts/validate_documentation_assets.py

      - name: Sync generated documentation assets
        run: |
          python scripts/sync_documentation_assets.py
          python scripts/sync_documentation_assets.py --check

      - name: Build website
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
